<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narwhal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🦄 Narwhal</h1>
  <p>Scan, snap a live moment, and pin it to the board!</p>

  <!-- Main Start Button -->
  <button id="take-photo-btn">📸 Take Live Polaroid</button>

  <!-- Live Camera Section -->
  <section id="camera-section" style="display:none;">
    <video id="camera-feed" autoplay playsinline></video>
    <button id="snap-btn">📸 Capture</button>
  </section>

  <!-- Caption & Pin Form -->
  <section id="pin-section" style="display:none;">
    <canvas id="photo-preview"></canvas>
    <input type="text" id="caption" maxlength="10" placeholder="Max 10 chars">
    <button id="upload-btn">📌 Pin to Wall</button>
  </section>

  <!-- The Digital Corkboard -->
  <main id="corkboard-grid">
    <!-- Pinned polaroid photos from Supabase will load here dynamically -->
  </main>

  <script defer src="App.js"></script>
</body>
</html>

</body>
