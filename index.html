<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Photo Wall</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="header">
    <h1 class="title">Wedding Photo Wall</h1>
    <label for="camera-input" class="snap-btn" id="upload-label">
      📷 Take Photo
    </label>
    <input type="file" id="camera-input" accept="image/*" capture="environment">
  </header>

  <main class="wall" id="photo-wall"></main>

  <script src="app.js"></script>
</body>
</html>
